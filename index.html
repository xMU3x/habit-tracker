<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F0" id="tc"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.ico">
<title>ذِكر</title>
<style>
@font-face{font-family:T;src:url(fonts/Tajawal-Regular.ttf);font-weight:400}
@font-face{font-family:T;src:url(fonts/Tajawal-Medium.ttf);font-weight:500}
@font-face{font-family:T;src:url(fonts/Tajawal-Bold.ttf);font-weight:700}
@font-face{font-family:A;src:url(fonts/Amiri-Regular.ttf)}@font-face{font-family:A;src:url(fonts/Amiri-Bold.ttf);font-weight:700}
:root{--bg:#F6F5F0;--sf:#fff;--on:#1F2A22;--on2:#7A7F76;--pri:#2F5A38;--pc:#E3EDDC;--gold:#B3903F;--ln:#E8E3D4;--e:cubic-bezier(.3,0,0,1)}
.mr{--bg:#FCF7F2;--on:#2B1A1E;--pri:#7A2336;--pc:#F0DFE3;--ln:#EADFD9;--on2:#9A8A86}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--on);font:400 16px T,system-ui;overflow:hidden;transition:background .3s var(--e)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.pg{position:fixed;inset:0;max-width:640px;margin:auto;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(96px + env(safe-area-inset-bottom));background:var(--bg);animation:in .3s var(--e) both}
@keyframes in{from{opacity:0;transform:translateX(-24px)}}
.back{animation-name:inb}@keyframes inb{from{opacity:0;transform:translateX(24px)}}
h1{font-size:28px;font-weight:700}.hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;justify-content:space-between}
.rb{width:48px;height:48px;border-radius:50%;background:var(--sf);border:1px solid var(--ln);font-size:20px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:28px;padding:18px;margin-bottom:12px;display:block;width:100%;text-align:start}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g .cd{margin:0;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-weight:700;font-size:19px}
.g small{font-weight:400;font-size:13px;color:var(--on2)}.w2{grid-column:span 2}
.hero{background:linear-gradient(160deg,#3B5368,#E0A860 60%,#434F3B);color:#fff;border-radius:28px;padding:22px;margin-bottom:12px;min-height:200px;display:block;width:100%;text-align:start}
.hero b{font-size:34px;font-family:A;display:block;margin:4px 0 16px}.bar{height:8px;border-radius:9px;background:#fff4;overflow:hidden}.bar i{display:block;height:100%;background:#fff;transition:width .4s var(--e)}
.q{font:400 22px/2.1 A;text-align:center}.sm{font-size:13px;color:var(--on2)}
.ct{width:56px;height:56px;border-radius:50%;background:var(--pc);border:2px solid var(--pri);color:var(--pri);font-weight:700;font-size:20px}.ct.d{background:var(--pri);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{position:fixed;bottom:0;inset-inline:0;max-width:640px;margin:auto;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:9}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:20px;color:var(--on2);height:56px;justify-content:center}
.nav button span{font-size:0;transition:font-size .2s var(--e)}.nav .on{color:var(--pri)}.nav .on span{font-size:12px;font-weight:700}
.ring{width:260px;height:260px;margin:24px auto;position:relative;display:grid;place-items:center;border-radius:50%;background:var(--sf)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}.ring b{font-size:72px}
.pill{background:var(--pc);color:var(--pri);border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px;display:inline-block;margin:4px 0 0 6px}
.pb{background:var(--pri);color:#fff;border-radius:28px;padding:16px;width:100%;font-weight:700;margin-top:10px}
input{font:inherit;width:100%;padding:14px 18px;border-radius:24px;border:1px solid var(--ln);background:var(--sf);margin-bottom:10px}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid var(--ln)}.chk.d{background:var(--gold);border-color:var(--gold);color:#fff}
.sheet{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;animation:f .2s}.sheet>div{background:var(--sf);border-radius:28px 28px 0 0;padding:22px;width:100%;max-width:640px;margin:auto}
@keyframes f{from{opacity:0}}.ch{display:inline-block;margin:4px;padding:12px 18px;border-radius:16px;border:1px solid var(--ln)}.ch.on{background:var(--pc);border-color:var(--pri)}
#toast{position:fixed;top:20px;inset-inline:20px;background:var(--on);color:#fff;border-radius:16px;padding:12px;text-align:center;z-index:30;display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),TD=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const N=x=>String(x).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2500)}
// ===== التخزين المحلي + المزامنة: {key:{v,t}} — نفس الشكل محليًا وعلى السيرفر =====
let S=JSON.parse(localStorage.zk||'{}'),sb=null,user=null,sync='local',tm;
const get=(k,d)=>S[k]?S[k].v:d;
function set(k,v){S[k]={v,t:Date.now()};localStorage.zk=JSON.stringify(S);clearTimeout(tm);tm=setTimeout(push,1500)}
async function push(){if(!sb||!user)return;sync='sync';const{error}=await sb.from('user_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});sync=error?'err':'ok';if(location.hash==='#acc')go()}
async function pull(){const{data,error}=await sb.from('user_data').select('data').eq('user_id',user.id).maybeSingle();if(error){sync='err';return}
 const R=data?.data||{};for(const k in R)if(!S[k]||R[k].t>S[k].t)S[k]=R[k];localStorage.zk=JSON.stringify(S);await push()}
async function initAuth(){const c=window.ZK_CFG;if(!c||c.url.includes('YOUR-')||!window.supabase)return;
 sb=supabase.createClient(c.url,c.anon,{auth:{persistSession:true,detectSessionInUrl:true}});
 const{data}=await sb.auth.getSession();user=data.session?.user||null;if(user)await pull();
 sb.auth.onAuthStateChange(async(e,s)=>{user=s?.user||null;if(user)await pull();go()})}
const login=()=>sb?sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}}):toast('أضف بيانات Supabase في config.js');
// ===== البيانات =====
let AZ=[],CH=[];
const tab=(h)=>`<nav class="nav">${[['','⌂','الرئيسية'],['athkar','✦','الأذكار'],['tasbeeh','☝','التسبيح'],['more','▦','المزيد']].map(([k,i,l])=>`<button class="${h==k?'on':''}" onclick="location.hash='${k}'">${i}<span>${l}</span></button>`).join('')}</nav>`;
const hd=(t,b)=>`<div class="hd"><h1>${t}</h1>${b?`<button class="rb" onclick="history.back()">‹</button>`:''}</div>`;
const hij=()=>new Intl.DateTimeFormat('ar-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
const azd=()=>get('az:'+TD(),{}),chp=id=>azd()[id]||{};
const chDone=c=>c.azkar.filter(z=>(chp(c.id)[z.id]||0)>=(+z.count||1)).length;
const slot=()=>{const h=new Date().getHours();return h<12?['morning','أذكار الصباح','hisn-27']:['evening','أذكار المساء','hisn-27']};
// ===== الشاشات =====
function home(){const c=AZ.find(x=>x.id==='hisn-27'),n=c?c.azkar.length:0,d=c?chDone(c):0,[,t]=slot();
 return`<div class="hd"><b style="font:700 34px A">ذِكر</b><span class="sm">${hij()}</span></div>
 <button class="hero" onclick="location.hash='athkar/hisn-27'"><span>حان وقت</span><b>${t}</b><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><small>أنجزت ${N(d)} من ${N(n)}</small></button>
 <div class="g"><button class="cd" onclick="location.hash='athkar'">الأذكار<small>حصن المسلم</small></button><button class="cd" onclick="location.hash='tasbeeh'">التسبيح<small>سبحة إلكترونية</small></button>
 <button class="cd w2" onclick="location.hash='challenges'">تحديات اليوم · ${N(chList().filter(x=>chd()[x.id]).length)} / ${N(5)}<small>أهدافك وإنجازاتك</small></button></div>`}
function athkar(){return hd('الأذكار',1)+AZ.map(c=>`<button class="cd" onclick="location.hash='athkar/${c.id}'"><div class="row"><b>${esc(c.title)}</b><span class="sm">${N(chDone(c))}/${N(c.azkar.length)}</span></div></button>`).join('')}
let hideDone=false;
function reader(id){const c=AZ.find(x=>x.id==id);if(!c)return'';const p=chp(id),dn=chDone(c);
 return`<div class="hd"><h1 style="font-size:22px">${esc(c.title)}</h1><div><button class="rb" onclick="menu('${id}')">⋮</button> <button class="rb" onclick="history.back()">‹</button></div></div>
 <div class="bar" style="background:var(--pc);margin-bottom:14px"><i style="background:var(--pri);width:${dn/c.azkar.length*100}%"></i></div>`+
 c.azkar.map(z=>{const n=+z.count||1,r=p[z.id]||0,fav=get('fav',[]).includes(id+':'+z.id);if(hideDone&&r>=n)return'';
 return`<div class="cd"><div class="q" style="font-size:${/[﴿]/.test(z.text)?21:22}px">${esc(z.text)}</div><p class="sm" style="margin:10px 0">${esc(z.source||'')}</p>
 <div class="row"><button class="ct ${r>=n?'d':''}" onclick="cnt('${id}','${z.id}',${n})">${r>=n?'✓':N(n-r)}</button><div><button onclick="fv('${id}:${z.id}')" style="font-size:22px;color:var(--gold)">${fav?'♥':'♡'}</button> <button onclick="navigator.clipboard.writeText(this.dataset.t).then(()=>toast('تم النسخ'))" data-t="${esc(z.text)}" style="font-size:20px">⧉</button></div></div></div>`}).join('')}
function cnt(id,zid,n){const a=azd(),p=a[id]=a[id]||{};if((p[zid]||0)<n){p[zid]=(p[zid]||0)+1;navigator.vibrate?.(15)}set('az:'+TD(),a);go(1)}
function fv(k){let f=get('fav',[]);f=f.includes(k)?f.filter(x=>x!=k):[...f,k];set('fav',f);go(1)}
function menu(id){sheet(`<button class="cd" onclick="hideDone=!hideDone;closeS();go(1)">${hideDone?'إظهار المكتملة':'إخفاء المكتملة'}</button><button class="cd" onclick="const a=azd();delete a['${id}'];set('az:'+TD(),a);closeS();go(1)">إعادة تعيين العداد</button>`)}
const sheet=h=>{const s=document.createElement('div');s.className='sheet';s.id='sh';s.onclick=e=>e.target==s&&closeS();s.innerHTML='<div>'+h+'</div>';document.body.appendChild(s)},closeS=()=>$('#sh')?.remove();
// التسبيح
const T0=[['سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',100],['سُبْحَانَ اللَّهِ',33],['الْحَمْدُ لِلَّهِ',33],['اللَّهُ أَكْبَرُ',34],['أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ',100],['لَا إِلَهَ إِلَّا اللَّهُ',100],['اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ',100]];
const tl=()=>get('tl',T0.map((x,i)=>({id:'t'+i,text:x[0],goal:x[1],total:0,count:0,rounds:0})));
function tasbeehList(){return hd('السبحة',1).replace('<h1>','<button class="rb" onclick="addT()">＋</button><h1>')+tl().map(t=>`<button class="cd" onclick="location.hash='tasbeeh/${t.id}'"><div class="q" style="text-align:start;font-size:22px;line-height:1.8">${esc(t.text)}</div><span class="pill">عدد الخرزات ${N(t.goal)}</span><span class="pill">الإجمالي ${N(t.total)}</span></button>`).join('')}
function addT(){sheet(`<h2>إضافة ذكر مخصص</h2><br><input id="tx" placeholder="نص الذكر"><input id="tg" type="number" value="33"><button class="pb" onclick="const L=tl();L.push({id:'t'+Date.now(),text:tx.value.trim()||'ذكر',goal:+tg.value||33,total:0,count:0,rounds:0});set('tl',L);closeS();go(1)">إضافة</button>`)}
function tasbeeh(id){const t=tl().find(x=>x.id==id);if(!t)return'';const p=t.count/t.goal,C=2*Math.PI*120;
 return`<div class="hd"><h1>التسبيح</h1><div><button class="rb" onclick="goalS('${id}')">⚙</button> <button class="rb" onclick="upd('${id}',x=>{x.count=0;x.rounds=0})">↻</button> <button class="rb" onclick="history.back()">‹</button></div></div>
 <div class="cd"><div class="sm" style="text-align:center;color:var(--pri)">الذكر الحالي</div><div class="q">${esc(t.text)}</div></div>
 <div class="ring" onclick="tap('${id}')"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="120" fill="none" stroke="var(--pc)" stroke-width="12"/><circle cx="130" cy="130" r="120" fill="none" stroke="var(--pri)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:stroke-dashoffset .25s var(--e)"/></svg><div style="text-align:center"><b>${N(t.count)}</b><br><span class="pill">من ${N(t.goal)}</span></div></div>
 <div class="cd row" style="text-align:center"><div><b>${N(t.total)}</b><br><small class="sm">الإجمالي</small></div><div><b>${N(t.rounds)}</b><br><small class="sm">الجولات</small></div><div><b>${N(Math.round(p*100))}٪</b><br><small class="sm">التقدم</small></div></div><p class="sm" style="text-align:center">اضغط في أي مكان للعدّ</p>`}
function upd(id,f){const L=tl();f(L.find(x=>x.id==id));set('tl',L);go(1)}
function tap(id){upd(id,t=>{t.count++;t.total++;navigator.vibrate?.(10);if(t.count>=t.goal){t.count=0;t.rounds++;navigator.vibrate?.([60,40,60])}})}
function goalS(id){sheet(`<h2>عدد الخرزات (الهدف)</h2><br>${[33,99,100,313,1000].map(g=>`<button class="ch" onclick="upd('${id}',t=>{t.goal=${g};t.count=0});closeS()">${N(g)}</button>`).join('')}`)}
// التحديات
const chd=()=>get('ch:'+TD(),{});
function chList(){const D=CH.filter(x=>x.period==='day'),d=new Date(),s=d.getFullYear()*372+d.getMonth()*31+d.getDate(),o=[];for(let i=0;i<5;i++)o.push(D[(s*7+i*13)%D.length]);return[...new Map(o.map(x=>[x.id,x])).values()]}
function challenges(){const L=chList(),m=chd(),dn=L.filter(x=>m[x.id]).length;
 return hd('التحديات',1)+`<div class="cd" style="background:var(--pc)"><b style="font:700 26px A;color:var(--pri)">${dn?'أحسنت، واصل':'ابدأ بأسهل تحدٍّ'}</b><p class="sm">خطوة صغيرة اليوم تصنع عادة دائمة.</p><div class="bar" style="background:#fff;margin-top:10px"><i style="background:var(--gold);width:${dn/L.length*100}%"></i></div><p style="margin-top:8px;color:var(--pri)">${N(dn)} من ${N(L.length)}</p></div>
 <h2 style="margin:14px 0">تحديات اليوم</h2>`+L.map(x=>`<div class="cd row"><b style="flex:1">${esc(x.title)}</b><button class="chk ${m[x.id]?'d':''}" onclick="tc('${x.id}')">${m[x.id]?'✓':''}</button></div>`).join('')}
function tc(id){const m=chd();m[id]=!m[id];set('ch:'+TD(),m);const L=chList();let days=get('days',[]);const k=new Date().toISOString().slice(0,10);if(L.every(x=>m[x.id])&&!days.includes(k)){days.push(k);set('days',days)}go(1)}
function more(){const B=(h,t,s)=>`<button class="cd" onclick="location.hash='${h}'"><b>${t}</b><div class="sm">${s}</div></button>`;
 return hd('المزيد')+`<p class="sm" style="margin:-8px 0 14px">كل أدواتك الإسلامية في مكان واحد</p>`+B('athkar','الأذكار','حصن المسلم')+B('challenges','التحديات','أهدافك وإنجازاتك')+B('tasbeeh','التسبيح','سبحة إلكترونية')+B('acc','حسابي والمزامنة',user?esc(user.email):'سجّل الدخول بحساب Google')+`<a class="cd" href="/werd.html" style="display:block;color:inherit;text-decoration:none"><b>متابعة العادات (وِرد)</b><div class="sm">العادات والمهام والمحاضرات والصيام</div></a>`}
function acc(){const m={ok:'تمت المزامنة',sync:'جارٍ المزامنة…',err:'تعذّرت المزامنة، سنحاول مرة أخرى تلقائيًا',local:'غير مفعّلة'}[sync];
 if(!user)return hd('حسابي',1)+`<div class="cd" style="text-align:center"><b style="font:700 40px A">ذِكر</b><p class="sm" style="margin:10px 0 18px">سجّل الدخول لتُحفظ بياناتك وتُزامن تلقائيًا على حسابك</p><button class="pb" onclick="login()">متابعة بحساب Google</button></div>`;
 return hd('حسابي',1)+`<div class="cd row"><div><b>${esc(user.user_metadata?.full_name||'')}</b><div class="sm">${esc(user.email)}</div><div class="sm">حساب Google</div></div><div class="ct d">${esc((user.email||'M')[0].toUpperCase())}</div></div>
 <div class="cd"><b>مزامنة التقدّم</b><p class="sm" style="color:${sync=='err'?'#a33':'var(--on2)'}">${m}</p><p class="sm">الأذكار • السبحة • المفضلة والعدّادات • التحديات</p><button class="pb" onclick="push().then(()=>toast('تمت المزامنة'))">مزامنة الآن</button></div>
 <button class="cd" onclick="sb.auth.signOut().then(()=>{user=null;sync='local';go()})">تسجيل الخروج</button>`}
// ===== الموجّه =====
let last='x';const MR=['tasbeeh','acc'];
function go(keep){const h=location.hash.slice(1),[r,a]=h.split('/');let v='',t=r;
 if(!user&&sb&&!localStorage.skip&&r!=='acc')return location.hash='acc',void(localStorage.skip=1);
 if(!r)v=home();else if(r==='athkar')v=a?reader(a):athkar();else if(r==='tasbeeh')v=a?tasbeeh(a):tasbeehList();else if(r==='challenges')v=challenges();else if(r==='more')v=more();else if(r==='acc')v=acc();
 const old=$('.pg'),sc=old&&keep?old.scrollTop:0;document.documentElement.className=MR.includes(r)?'mr':'';$('#tc').content=MR.includes(r)?'#FCF7F2':'#F6F5F0';
 $('#app').innerHTML=`<div class="pg ${keep?'':(h.length<last.length?'back':'')}" style="${keep?'animation:none':''}">${v}</div>${tab(['','athkar','tasbeeh','more'].includes(t||'')?t||'':'more')}`;
 $('.pg').scrollTop=sc;last=h}
addEventListener('hashchange',()=>go());
(async()=>{try{[AZ,CH]=await Promise.all([fetch('data/azkar.json').then(r=>r.json()).then(j=>j.categories),fetch('data/challenges.json').then(r=>r.json()).then(j=>j.challenges)])}catch(e){toast('تعذّر تحميل البيانات')}
 await initAuth();go();if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js')})();
</script></body></html>

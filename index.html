<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF7F2" id="tc">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>بلال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCF7F2;--surf:#fff;--surf2:#F5ECE6;--on:#2A1A1E;--on2:#7A6A6C;--pri:#7A2336;--onpri:#fff;--pc:#F3DEE2;--onpc:#4A0F1E;--sc:#EFE6DA;--sec:#6B4A1E;--line:#EADFD8;--scrim:rgba(20,8,12,.45);
--e:cubic-bezier(.2,0,0,1);--ee:cubic-bezier(.3,0,0,1);--nav:76px;--r:28px;
--ui:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;--q:'Amiri','Traditional Arabic',serif}
:root[data-eff="dark"]{--bg:#0C0A0B;--surf:#171315;--surf2:#211A1D;--on:#F3EAEC;--on2:#A99BA0;--pri:#E58A9C;--onpri:#3B0A16;--pc:#4A1A26;--onpc:#FFD9DF;--sc:#3A2E1E;--sec:#E6C28A;--line:#2D2428;--scrim:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--on);font-family:var(--ui);transition:background-color .35s var(--e),color .35s var(--e);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;position:relative;overflow:hidden;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.sb{position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;transition:background-color .35s var(--e)}
.app{position:fixed;inset:0;max-width:640px;margin:0 auto}
.page{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(var(--nav) + env(safe-area-inset-bottom,0px) + 24px);visibility:hidden;opacity:0}
.page.on{visibility:visible;opacity:1}
.page.in-f{animation:inF .34s var(--ee) both}.page.in-b{animation:inB .34s var(--ee) both}
.page.out{visibility:visible;animation:out .2s var(--e) both;pointer-events:none}
@keyframes inF{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0}}
.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--onpc)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:56px;margin-bottom:8px}
.top .g{display:flex;gap:8px}
h1{font-size:22px;font-weight:700}h2{font-size:18px;font-weight:600;color:var(--pri);margin:24px 4px 12px;display:flex;justify-content:space-between;align-items:center}
h2 button{font-size:14px;font-weight:500;padding:8px 12px;border-radius:20px;min-height:40px}
.hero{border-radius:var(--r);padding:20px;color:#fff;background:linear-gradient(135deg,#0B0507 0%,#3A0F1A 50%,#7A2336 100%);display:grid;gap:16px}
.hero .row{display:flex;align-items:center;gap:16px}
.logo{width:72px;height:72px;border-radius:24px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.logo svg{width:40px;height:40px;color:#F3C6CF}
.hero p{font-family:var(--q);font-size:21px;line-height:1.9}
.date{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.12);border-radius:20px;padding:12px 16px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:48px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background-color .35s var(--e),border-color .35s var(--e)}
.card b{font-weight:600;font-size:17px}.card small{color:var(--on2);font-size:13px}
.card .ic{margin-bottom:10px;border-radius:16px}
.k{display:flex;align-items:center;gap:16px;margin-top:12px;text-align:start;width:100%}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(90deg) scaleX(-1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--surf2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--sec);border-radius:4px;transform-origin:right;transition:width .4s var(--ee)}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--on2);font-size:14px;font-weight:500;color:var(--pri)}
.pray{background:linear-gradient(135deg,#121014,#1c161a);color:#F3EAEC;border-radius:var(--r);padding:20px;margin-top:12px;display:grid;gap:12px;transition:background .6s var(--e)}
.pray[data-p="fajr"]{background:linear-gradient(135deg,#0d1226,#2a2250)}.pray[data-p="dhuhr"]{background:linear-gradient(135deg,#3a2a0c,#7a5a1a)}
.pray[data-p="asr"]{background:linear-gradient(135deg,#3b2410,#8a4a1e)}.pray[data-p="maghrib"]{background:linear-gradient(135deg,#2a0f1a,#7A2336)}.pray[data-p="isha"]{background:linear-gradient(135deg,#0b0b14,#1d1d3a)}
.pray .n{font-size:14px;opacity:.75}.pray .t{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;font-weight:500;min-height:104px;transition:background-color .35s var(--e)}
.tile .ic{border-radius:18px;width:52px;height:52px}
.tile.s .ic{background:var(--sc);color:var(--sec)}
.list{display:grid;gap:8px}
.row-i{display:flex;align-items:center;gap:16px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:12px 16px;min-height:64px;text-align:start;width:100%}
.row-i div{flex:1}.row-i b{display:block;font-weight:600}.row-i small{color:var(--on2)}
.row-i svg.c{width:20px;height:20px;color:var(--on2)}
.pt{display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:20px;background:var(--surf);border:1px solid var(--line);font-size:17px;transition:background-color .3s var(--e)}
.pt.nx{background:var(--pc);color:var(--onpc);font-weight:600}.pt span:last-child{font-variant-numeric:tabular-nums;direction:ltr}
/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.nav nav{pointer-events:auto;width:100%;max-width:640px;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding:0 8px env(safe-area-inset-bottom,0px);display:flex;gap:4px;align-items:center;background:var(--surf2);box-shadow:0 -1px 0 var(--line),0 -6px 20px rgba(0,0,0,.06);transition:background-color .35s var(--e)}
.ni{flex:1 1 0;height:56px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--on2);transition:flex-grow .34s var(--ee),color .25s var(--e),background-color .3s var(--e);min-width:48px}
.ni .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background-color .3s var(--e),transform .34s var(--ee)}
.ni .lb{font-size:12px;font-weight:600;line-height:1;max-height:0;opacity:0;transform:translateY(-4px);transition:opacity .25s var(--e),transform .34s var(--ee),max-height .34s var(--ee);white-space:nowrap}
.ni[aria-selected="true"]{flex-grow:1.9;color:var(--onpc)}
.ni[aria-selected="true"] .pill{background:var(--pc)}
.ni[aria-selected="true"] .lb{max-height:14px;opacity:1;transform:none;color:var(--on)}
.ni:active .pill{transform:scale(.92)}
/* ripple + state layer */
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:rp .5s var(--ee) forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}

.sub{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}.sub::-webkit-scrollbar{display:none}
.sc{flex:none;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);font-weight:500;color:var(--on2);transition:background-color .25s var(--e),color .25s var(--e)}
.sc[aria-selected="true"]{background:var(--pc);color:var(--onpc);border-color:transparent}
.sum{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;display:grid;gap:6px}.sum small{color:var(--on2)}
.hb{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:12px 16px;margin-bottom:8px;min-height:64px;flex-wrap:wrap}
.hb .hr1{flex:1;display:grid;min-width:0}.hb small{color:var(--on2)}.hb .hr{display:flex;justify-content:space-between;align-items:center;width:100%}
.hb.dn .hr1 b{text-decoration:line-through;opacity:.6}
.chk{width:48px;height:48px;border-radius:50%;border:2px solid var(--on2);display:grid;place-items:center;color:transparent;flex:none;transition:background-color .25s var(--e),border-color .25s var(--e),color .25s var(--e)}
.chk[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.x{width:44px;height:44px;border-radius:50%;color:var(--on2);font-size:22px;flex:none}
.pr5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.pc{min-height:48px;border-radius:14px;border:1px solid var(--line);font-size:13px;font-weight:500;transition:background-color .25s var(--e)}
.pc[aria-pressed="true"]{background:var(--pc);color:var(--onpc);border-color:transparent}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.add input,.add select{flex:1 1 140px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--on);padding:0 12px;font:inherit;min-width:0}
.fb{min-height:48px;padding:0 20px;border-radius:24px;background:var(--pri);color:var(--onpri);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>b{font-size:11px;text-align:center;color:var(--on2);font-weight:500;padding:4px 0}
.cd{min-height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:var(--surf);border:1px solid var(--line);transition:background-color .25s var(--e)}
.cd small{font-size:9px;color:var(--on2)}.cd.pl{background:var(--sc);border-color:var(--sec)}.cd.dn{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.cd.dn small{color:inherit}.cd.mt{box-shadow:inset 0 -3px 0 var(--pc)}
.qg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qg .cd{min-height:56px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh b{font-weight:600}
.pri-u{color:#B3261E}.pri-h{color:#B3261E}.pri-m{color:var(--sec)}.pri-l{color:var(--on2)}
@media (prefers-color-scheme:dark){.pri-u,.pri-h{color:#F2B8B5}}

.hero{padding:14px;gap:10px}.hero p{font-size:18px;line-height:1.8}.logo{width:56px;height:56px;border-radius:18px}.logo svg{width:32px;height:32px}.date{padding:8px 12px;font-size:13px}
.card{padding:12px;border-radius:22px}.card .ic{width:40px;height:40px;margin-bottom:6px;border-radius:14px}.card b{font-size:15px}.card small{font-size:12px}
.grid2{gap:10px;margin-top:12px}.ring,.ring svg{width:52px;height:52px}.k{gap:12px}.k b{font-size:17px!important}
.pray{padding:14px;gap:6px}.pray .t{font-size:24px}
.tile{min-height:88px;padding:12px 6px;gap:8px;font-size:13px;border-radius:20px}.tile .ic{width:44px;height:44px;border-radius:14px}
.gbar{height:8px;border-radius:4px;background:var(--surf2);overflow:hidden;margin-top:8px}
.gbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#E0527A,#E8B04A);transition:width .5s var(--ee)}
.ai{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:8px}
.at{flex:1;font-family:var(--q);font-size:20px;line-height:2;min-width:0}
.ctr{width:48px;height:48px;border-radius:50%;background:var(--pc);color:var(--onpc);font-weight:700;flex:none;transition:background-color .25s var(--e)}.ctr.z{background:var(--pri);color:var(--onpri)}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;visibility:hidden;transition:opacity .3s var(--e),visibility .3s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;inset:auto 0 0 0;z-index:50;max-width:640px;margin:0 auto;max-height:86%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(105%);visibility:hidden;transition:transform .36s var(--ee),visibility .36s}
.sheet.on{transform:none;visibility:visible}
.grab{width:36px;height:4px;border-radius:2px;background:var(--on2);opacity:.5;margin:0 auto 16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surf2);border-radius:24px;padding:4px;margin:16px 0}
.seg button{min-height:48px;border-radius:20px;font-weight:500;color:var(--on2);transition:background-color .25s var(--e),color .25s var(--e)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dz{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:8px}
.dz .q{font-family:var(--q);font-size:25px;line-height:2.2}
.tip{background:var(--sc);color:var(--on);border-radius:16px;padding:12px 16px;font-size:14px;margin-top:12px;line-height:1.7}
.cnt{margin-top:16px;width:100%;min-height:56px;border-radius:28px;background:var(--pri);color:var(--onpri);font-weight:600;font-size:18px;transition:transform .2s var(--e)}
.cnt:active{transform:scale(.98)}
.snack{position:fixed;inset:auto 16px calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);z-index:60;max-width:608px;margin:0 auto;background:#322A2D;color:#F7EEF0;padding:14px 16px;border-radius:14px;font-size:14px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s var(--e),transform .3s var(--ee)}
.snack.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="sb"></div>
<div class="app" id="app">

<!-- HOME -->
<section class="page" id="home" aria-label="الرئيسية">
  <div class="top"><div class="g"><button class="ic" data-t="البحث قريباً" aria-label="بحث"><svg data-i="search"></svg></button><button class="ic" data-t="المفضلة قريباً" aria-label="المفضلة"><svg data-i="heart"></svg></button></div>
  <div class="g"><button class="ic" id="menuBtn" aria-label="القائمة"><svg data-i="menu"></svg></button></div></div>
  <div class="hero"><div class="row"><div class="logo"><svg data-i="spark"></svg></div><p>وَمَا يَزَالُ عَبْدِي يَتَقَرَّبُ إِلَيَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ</p></div>
  <div class="date"><svg data-i="clock"></svg><span id="dt"></span></div></div>
  <div style="margin-top:12px">
  <button class="card k" style="margin-top:0" data-go="werd"><div class="ring"><svg viewBox="0 0 36 36"><defs><linearGradient id="hgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0527A"/><stop offset="1" stop-color="#E8B04A"/></linearGradient></defs><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--surf2)" stroke-width="3.5"/><circle id="hg" cx="18" cy="18" r="15.5" fill="none" stroke="url(#hgr)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4" style="transition:stroke-dashoffset .5s var(--ee)"/></svg><span id="hp">0%</span></div><div style="flex:1"><small>عاداتي اليوم</small><b id="ht" style="display:block;font-size:20px">0 من 0 مكتملة</b><div class="gbar"><i id="hbar"></i></div></div></button>
  </div>
  <div class="grid2">
    <button class="card" data-go="adhkar"><span class="ic"><svg data-i="spark"></svg></span><b>الأذكار</b><small>صباحية ومسائية</small></button>
    <button class="card" data-t="المصحف قريباً"><span class="ic" style="background:var(--sc);color:var(--sec)"><svg data-i="book"></svg></span><b>القرآن الكريم</b><small>استمع وتدبّر</small></button>
  </div>
  <button class="card k" id="khatma"><div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--surf2)" stroke-width="3.5"/><circle id="rg" cx="18" cy="18" r="15.5" fill="none" stroke="var(--pri)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4" style="transition:stroke-dashoffset .5s var(--ee)"/></svg><span id="pc">0%</span></div>
    <div style="flex:1"><small>ختمتي الحالية</small><b id="kp" style="display:block;font-size:20px">0 من 604 صفحة</b><small id="kd">ورد اليوم: 0/5 صفحة</small><div class="bar"><i id="kb"></i></div></div></button>
  <div class="chips" aria-label="إضافة صفحات"><button class="chip" data-add="1">+1</button><button class="chip" data-add="5">+5</button><button class="chip" data-add="10">+10</button><button class="chip" data-add="20">+20</button></div>
  <div class="pray" id="pray" data-p="fajr"><div class="n" id="pn">الصلاة القادمة</div><div class="t" id="pt">--:--:--</div><div class="n" id="pw"></div></div>
  <h2>الوصول السريع<button data-go="menu" style="color:var(--pri)">عرض الكل</button></h2>
  <div class="grid3">
    <button class="tile" data-t="اتجاه القبلة قريباً"><span class="ic"><svg data-i="qibla"></svg></span>اتجاه القبلة</button>
    <button class="tile s" data-go="radio"><span class="ic"><svg data-i="radio"></svg></span>راديو القرآن</button>
    <button class="tile" data-t="السبحة قريباً"><span class="ic"><svg data-i="dot"></svg></span>السبحة</button>
    <button class="tile" data-t="الرقية الشرعية قريباً"><span class="ic"><svg data-i="heart"></svg></span>الرقية الشرعية</button>
    <button class="tile s" data-t="مكتبة الأحاديث قريباً"><span class="ic"><svg data-i="book"></svg></span>مكتبة الأحاديث</button>
    <button class="tile" data-go="fast"><span class="ic"><svg data-i="moon"></svg></span>الصيام</button>
  </div>
  <h2>تقدمك اليوم</h2>
  <div class="grid3">
    <button class="tile" data-go="adhkar"><span class="ic"><svg data-i="check"></svg></span><span>الأذكار<br><small style="color:var(--pri)">استئناف</small></span></button>
    <button class="tile s" id="wird"><span class="ic"><svg data-i="book"></svg></span><span>الورد اليومي<br><small style="color:var(--pri)">ابدأ وردك</small></span></button>
    <button class="tile" data-t="السبحة قريباً"><span class="ic"><svg data-i="dot"></svg></span><span>التسابيح<br><small style="color:var(--pri)">استئناف</small></span></button>
  </div>
</section>

<!-- ADHKAR -->
<section class="page" id="adhkar" aria-label="الأذكار">
  <div class="top"><h1>أذكار المسلم</h1></div>
  <div class="grid2" style="margin-top:0" id="ag"></div>
</section>

<!-- READERS -->
<section class="page" id="readers" aria-label="القرّاء">
  <div class="top"><h1>القرّاء</h1></div>
  <div class="list" id="rl"></div>
</section>

<!-- WERD -->
<section class="page" id="werd" aria-label="وِرد">
  <div class="top"><h1>وِرد · العادات اليومية</h1><button class="sc" id="usr" aria-label="تبديل المستخدم"></button></div>
  <div class="sub" id="wsub" role="tablist"></div>
  <div id="wb"></div>
</section>

 <div class="cal">${WD.map(w=>`<b>${w}</b>`).join('')}${cells.join('')}</div>`}

function vQuran(){const m=qd[U]||{},n=Object.values(m).filter(Boolean).length;
 return `<div class="sum"><b>${n}/30 جزء</b><div class="bar"><i style="width:${n/30*100}%"></i></div></div><div class="qg">${Array.from({length:30},(_,i)=>`<button class="cd${m[i+1]?' dn':''}" data-a="qj" data-id="${i+1}" aria-pressed="${!!m[i+1]}">${i+1}<small>جزء</small></button>`).join('')}</div><div class="add"><button class="sc" data-a="qr">إعادة تعيين القرآن</button></div>`}

function vLect(){const P=lp[U]||{};
 return (courses.length?courses.map(c=>{const n=c.lectures.filter(l=>P[l.id]).length;
 return `<div class="sum"><div class="hr" style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(c.name)}</b><br><small>${esc(c.lecturer||'')} · ${n}/${c.lectures.length}</small></div>${del('dc',c.id)}</div><div class="bar"><i style="width:${c.lectures.length?n/c.lectures.length*100:0}%"></i></div>
 ${c.lectures.map(l=>`<div class="hb${P[l.id]?' dn':''}" style="margin:0">${chk(!!P[l.id],'tl',l.id,l.title)}<div class="hr1"><b>${esc(l.title)}</b></div></div>`).join('')}
 <div class="add"><input id="nl-${c.id}" placeholder="عنوان محاضرة" aria-label="عنوان محاضرة"><button class="fb" data-a="al" data-id="${c.id}">إضافة</button></div></div>`}).join(''):'<p class="tip">لا توجد كورسات. أضف كورسًا لتتابع محاضراته.</p>')+
 `<div class="add"><input id="cn" placeholder="اسم الكورس" aria-label="اسم الكورس"><input id="cl" placeholder="المحاضر" aria-label="المحاضر"><button class="fb" data-a="ac">كورس جديد</button></div>`}

function vLog(){return alog.length?alog.slice(0,60).map(l=>`<div class="hb"><div class="hr1"><b>${l.done?'✓':'○'} ${esc(l.desc)}</b><small>${esc(l.user)} · ${esc(l.date)} · ${esc(l.time||'')}</small></div></div>`).join(''):'<p class="tip">لا يوجد نشاط بعد.</p>'}

const V={today:vToday,tasks:vTasks,fast:vFast,quran:vQuran,lect:vLect,log:vLog},SUBS=[['today','اليوم'],['tasks','مهام'],['fast','الصيام'],['quran','القرآن'],['lect','محاضرات'],['log','السجل']];
function RW(anim){$('#usr').textContent=U;$('#wsub').innerHTML=SUBS.map(s=>`<button class="sc" role="tab" data-sub="${s[0]}" aria-selected="${s[0]===sub}">${s[1]}</button>`).join('');
 const b=$('#wb');b.innerHTML=V[sub]();icons(b);$('#fb').innerHTML=vFast();icons($('#fb'));homeHS();
 if(anim){b.classList.remove('page','in-b');void b.offsetWidth;b.style.animation='inB .3s var(--ee) both';setTimeout(()=>b.style.animation='',320)}}
const val=id=>($('#'+id)?.value||'').trim();
document.addEventListener('click',e=>{
 const sb=e.target.closest('[data-sub]');if(sb){sub=sb.dataset.sub;RW(true);return}
 if(e.target.closest('#usr')){U=U==='محمد'?'نيرة':'محمد';sv('user',U);RW();toast('الملف الحالي: '+U);return}
 const a=e.target.closest('#wb [data-a],#fb [data-a]');if(!a)return;const id=a.dataset.id,k=a.dataset.a,h=habits.find(x=>x.id===id);
 if(k==='th'){addLog('habit',h.name,flip(id))}
 else if(k==='tp'){addLog('prayer','صلاة '+a.dataset.p,flip(id+'__'+a.dataset.p))}
 else if(k==='dh'){habits=habits.filter(x=>x.id!==id);sv('habits',habits);toast('تم حذف العادة')}
 else if(k==='ah'){const n=val('nh');if(!n){toast('اكتب اسم العادة');return}habits.push({id:uid(),name:n,cat:$('#nc').value,target:'',user:'كلاهما'});sv('habits',habits)}
 else if(k==='tt'){const t=tasks.find(x=>x.id===id);t.done=!t.done;t.doneAt=t.done?Date.now():null;sv('tasks',tasks);addLog('task',t.text,t.done)}
 else if(k==='dt'){tasks=tasks.filter(x=>x.id!==id);sv('tasks',tasks)}
 else if(k==='at'){const n=val('nt');if(!n){toast('اكتب نص المهمة');return}tasks.push({id:'t'+Date.now(),text:n,date:val('nd'),done:false,ts:Date.now(),priority:$('#np').value,assignedTo:U,archived:false,doneAt:null,completedBy:[]});sv('tasks',tasks)}
 else if(k==='fd'){const i=fastDays.findIndex(x=>x.date===id),f=fastDays[i];if(!f)fastDays.push({date:id,checkedBy:[],type:'نفل',assignedTo:U});else if(!(f.checkedBy||[]).includes(U)){f.checkedBy=[...(f.checkedBy||[]),U];addLog('fast','صيام '+id,true)}else fastDays.splice(i,1);sv('fastDays',fastDays)}
 else if(k==='fm'){const d=new Date(hb);if(+id>0){const m=hmonth(hb);d.setTime(m[m.length-1].getTime()+864e5)}else{d.setTime(hmonth(hb)[0].getTime()-864e5)}hb=d}
 else if(k==='qj'){qd[U]=qd[U]||{};qd[U][id]=!qd[U][id];sv('quranData',qd)}
 else if(k==='qr'){qd[U]={};sv('quranData',qd);toast('تمت إعادة التعيين')}
 else if(k==='ac'){const n=val('cn');if(!n){toast('اكتب اسم الكورس');return}courses.push({id:uid(),name:n,user:U,lecturer:val('cl'),playlistUrl:'',lectures:[],pinned:false});sv('courses',courses)}
 else if(k==='dc'){courses=courses.filter(x=>x.id!==id);sv('courses',courses)}
 else if(k==='al'){const n=val('nl-'+id);if(!n)return;courses.find(x=>x.id===id).lectures.push({id:uid(),title:n});sv('courses',courses)}
 else if(k==='tl'){lp[U]=lp[U]||{};lp[U][id]=!lp[U][id];sv('lectureProgress',lp);addLog('lecture','محاضرة',lp[U][id])}
 RW()});
/* الأذكار من Supabase (adhkarSections) */
function renderAd(){$('#ag').innerHTML=adh.length?adh.map(x=>`<button class="card" style="min-height:84px;justify-content:center;align-items:center;text-align:center" data-dz="${esc(x.id)}"><b>${esc(x.title)}</b><small>${(x.items||[]).length} أذكار</small></button>`).join(''):'<p class="tip" style="grid-column:1/-1">لا توجد أقسام أذكار.</p>'}
function renderDz(){const x=adh.find(q=>q.id===sec);if(!x)return;$('#dzt').textContent=x.title;
 $('#dzb').innerHTML=(x.items||[]).length?x.items.map(it=>{const r=it.count?(it.remaining??it.count):null;return `<div class="ai">${it.count?`<button class="ctr${r===0?' z':''}" data-ad="dec" data-id="${it.id}" aria-label="العداد: ${r}">${r}</button>`:''}<div class="at">${esc(it.text)}</div>${it.count?`<button class="x" data-ad="rst" data-id="${it.id}" aria-label="إعادة العداد">↺</button>`:''}</div>`}).join(''):'<p class="tip">لا توجد أذكار مضافة بعد.</p>'}
document.addEventListener('click',e=>{const d=e.target.closest('[data-dz]');if(d){sec=d.dataset.dz;renderDz();openSheet('#dz');return}
 const a=e.target.closest('[data-ad]');if(!a)return;const it=adh.find(q=>q.id===sec).items.find(q=>q.id===a.dataset.id);
 if(a.dataset.ad==='dec'){const r=it.remaining??it.count;if(r>0)it.remaining=r-1}else it.remaining=it.count;sv("adhkarSections",adh);renderDz()});
const isO=v=>v&&typeof v==='object'&&!Array.isArray(v);
async function boot(){const R=await Promise.all(['habits','records','fastDays','quranData','tasks','courses','lectureProgress','activityLog','adhkarSections'].map(k=>api(KEY(k))));
 if(Array.isArray(R[0])&&R[0].length)habits=R[0];if(Array.isArray(R[1]))records=R[1];if(Array.isArray(R[2]))fastDays=R[2];if(isO(R[3]))qd=R[3];
 if(Array.isArray(R[4]))tasks=R[4];if(Array.isArray(R[5]))courses=R[5];if(isO(R[6]))lp=R[6];if(Array.isArray(R[7]))alog=R[7];if(Array.isArray(R[8])&&R[8].length)adh=R[8];
 RW();renderAd();if(sec&&$("#dz").classList.contains("on"))renderDz()}
RW();renderAd();boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));

icons();applyTheme();go('home');
</script>

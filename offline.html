<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c9a84c">
<title>وِرد — غير متصل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Cairo',sans-serif;
    background:#0e1017;color:#dde0f0;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:20px;
  }
  .wrap{max-width:320px;}
  .icon{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#c9a84c,#8b6918);
    display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;
    animation:float 3s ease-in-out infinite;box-shadow:0 6px 24px rgba(201,168,76,.3);}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-size:1.4rem;font-weight:900;margin-bottom:10px;color:#e8c96a}
  p{color:#a8abc4;font-size:.9rem;line-height:1.7;margin-bottom:24px;}
  .btn{
    display:inline-block;
    background:linear-gradient(135deg,#c9a84c,#a07830);
    color:#111;padding:14px 28px;border-radius:12px;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:1rem;
    cursor:pointer;border:none;text-decoration:none;
    box-shadow:0 4px 18px rgba(201,168,76,.3);
    transition:all .2s;
  }
  .btn:hover{transform:translateY(-2px);}
  .status{
    margin-top:20px;font-size:.78rem;color:#5a5f78;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#e05c5c;
    animation:pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
  <div class="wrap">
    <span class="icon">☽</span>
    <h1>مفيش اتصال بالنت</h1>
    <p>
      أنت حالياً غير متصل بالإنترنت.<br>
      لازم تكون متصل عشان تسجّل أو تشوف عاداتك في «وِرد».
    </p>
    <button class="btn" onclick="tryReload()">🔄 حاول تاني</button>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">غير متصل</span>
    </div>
  </div>
  <script>
    function tryReload(){
      if(navigator.onLine){
        window.location.href='/';
      } else {
        const btn=document.querySelector('.btn');
        btn.textContent='⏳ جاري المحاولة...';
        setTimeout(()=>btn.textContent='🔄 حاول تاني',1500);
      }
    }
    window.addEventListener('online',()=>{
      document.getElementById('dot').style.background='#4caf7d';
      document.getElementById('status-text').textContent='عاد الاتصال! جاري الفتح...';
      setTimeout(()=>window.location.href='/',1000);
    });
    window.addEventListener('offline',()=>{
      document.getElementById('dot').style.background='#e05c5c';
      document.getElementById('status-text').textContent='غير متصل';
    });
  </script>
</body>
</html>
